spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/papers_dev
    username: papers
    password: devpassword

  jpa:
    properties:
      hibernate:
        show_sql: true

  thymeleaf:
    cache: false          # 템플릿 수정 즉시 반영

  devtools:
    restart:
      enabled: true

app:
  storage:
    root: ${user.home}/papers-dev
  admin:
    email: admin@lab.local
    password: admin1234

logging:
  level:
    com.lab.paperarchive: debug
    org.hibernate.orm.jdbc.bind: trace    # 쿼리 파라미터 확인
