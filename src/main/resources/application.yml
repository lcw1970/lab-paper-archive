spring:
  application:
    name: paper-archive

  profiles:
    default: local

  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: validate      # 스키마는 Flyway가 관리. 절대 update 금지
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 120MB
      file-size-threshold: 2MB

  thymeleaf:
    cache: true

  web:
    resources:
      cache:
        cachecontrol:
          max-age: 7d

server:
  port: 8080
  servlet:
    session:
      timeout: 8h                  # 랩 내부용이라 넉넉하게
      cookie:
        http-only: true
        same-site: lax
  error:
    whitelabel:
      enabled: false

# ── 애플리케이션 고유 설정 ──
app:
  storage:
    root: ${STORAGE_ROOT:/data/papers}
    max-file-size-bytes: 104857600       # 100MB, 서버측 2차 검증
    trash-retention-days: 30
  admin:
    email: ${ADMIN_EMAIL:admin@lab.local}
    password: ${ADMIN_PASSWORD:}
  extract:
    enabled: true
    max-pages: 300                       # 초대형 PDF 방어

logging:
  level:
    root: info
    com.lab.paperarchive: info
