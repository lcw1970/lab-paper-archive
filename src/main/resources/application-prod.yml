spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    properties:
      hibernate:
        show_sql: false

  thymeleaf:
    cache: true

server:
  servlet:
    session:
      cookie:
        secure: true         # Tailscale Serve의 HTTPS를 통해서만 운영

logging:
  level:
    root: warn
    com.lab.paperarchive: info
  file:
    name: /app/logs/paper-archive.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 500MB
