<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title layout:title-pattern="$CONTENT_TITLE · 논문 아카이브">논문 아카이브</title>
    <link rel="stylesheet" th:href="@{/css/app.css(v=20260828)}">
</head>
<body>
<header class="topbar" sec:authorize="isAuthenticated()">
    <a class="brand" th:href="@{/}" aria-label="논문 아카이브 홈">P.</a>
    <nav>
        <a th:href="@{/papers}">논문 목록</a>
        <a th:href="@{/admin/users}" sec:authorize="hasRole('ADMIN')">회원 관리</a>
        <span class="me"><span sec:authentication="principal.name">이름</span> / LAB</span>
        <form th:action="@{/logout}" method="post" class="inline">
            <button type="submit" class="link-btn">로그아웃</button>
        </form>
    </nav>
</header>

<main layout:fragment="content"></main>

<footer class="footer">
    PAPER ARCHIVE · 랩 내부 연구 목적으로만 이용하며 외부 배포를 금합니다.
</footer>
</body>
</html>
