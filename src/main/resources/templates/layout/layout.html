<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#03c75a">
    <title layout:title-pattern="$CONTENT_TITLE · 논문 아카이브">논문 아카이브</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg(v=20260831a)}">
    <link rel="stylesheet" th:href="@{/css/app.css(v=20260828d)}">
    <link rel="stylesheet" th:href="@{/css/bulk.css(v=20260828a)}">
    <link rel="stylesheet" th:href="@{/css/folder.css(v=20260831b)}">
    <link rel="stylesheet" th:href="@{/css/theme.css(v=20260831b)}">
</head>
<body>
<header class="topbar" sec:authorize="isAuthenticated()">
    <a class="brand" th:href="@{/}" aria-label="TCTE 논문 데이터 베이스 홈">
        <img class="brand-icon" th:src="@{/images/favicon.svg(v=20260831a)}" alt="" aria-hidden="true">
        <span>TCTE 논문 데이터 베이스</span>
    </a>
    <nav>
        <a th:href="@{/papers}">논문 목록</a>
        <a th:href="@{/papers/trash}">휴지통</a>
        <a th:href="@{/admin/users}" sec:authorize="hasRole('ADMIN')">회원 관리</a>
        <span class="me"><span sec:authentication="principal.name">이름</span> / LAB</span>
        <form th:action="@{/logout}" method="post" class="inline">
            <button type="submit" class="link-btn">로그아웃</button>
        </form>
    </nav>
</header>

<main layout:fragment="content"></main>

<footer class="footer">
    PAPER ARCHIVE · 랩 내부 연구 목적으로만 이용하며 외부 배포를 금합니다.
</footer>
</body>
</html>
