<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"

      layout:decorate="~{layout/layout}">
<head><title>신청 완료</title></head>
<body>
<main layout:fragment="content" class="center-box">
    <div class="card">
        <h1>신청이 접수되었습니다</h1>
        <p class="sub">
            관리자가 승인하면 로그인할 수 있습니다.<br>
            승인은 별도 안내 없이 처리되니 잠시 후 다시 시도해 주세요.
        </p>
        <a class="primary btn" th:href="@{/login}">로그인 화면으로</a>
    </div>
</main>
</body>
</html>
