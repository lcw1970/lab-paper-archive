<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>논문 목록</title>
</head>
<body>
<main layout:fragment="content" class="container">

    <div class="list-header">
        <h1 th:text="${browseMode} ? '논문 폴더' : (${selectedFolderName} ?: (${uncategorized} ? '미분류' : '논문 목록'))">논문 폴더</h1>
        <a class="btn primary" th:href="@{/papers/upload}">+ 논문 등록</a>
    </div>

    <div class="alert info" th:if="${message}" th:text="${message}"></div>
    <div class="alert error" th:if="${error}" th:text="${error}"></div>

    <section class="folder-browser" th:if="${browseMode}">
        <p class="folder-intro">폴더를 열어 그 안의 논문을 확인하세요.</p>

        <form class="folder-create" th:action="@{/papers/folders}" method="post">
            <label for="folderName">새 폴더</label>
            <input id="folderName" name="name" maxlength="100" required
                   placeholder="예: 지압강도 관련" autocomplete="off">
            <button type="submit" class="btn">폴더 만들기</button>
        </form>

        <div class="folder-grid">
            <div class="folder-item" th:each="summary : ${folderSummaries}">
                <a class="folder-card" th:href="@{/papers(folder=${summary.id})}">
                    <span class="folder-mark" aria-hidden="true">▰</span>
                    <span class="folder-card-name" th:text="${summary.name}">폴더 이름</span>
                    <span class="folder-count" th:text="${summary.paperCount} + '편'">0편</span>
                </a>
                <form th:action="@{/papers/folders/{id}/delete(id=${summary.id})}" method="post"
                      onsubmit="return confirm('폴더를 삭제할까요? 안의 논문은 미분류로 이동합니다.');">
                    <button class="folder-delete" type="submit" aria-label="폴더 삭제">×</button>
                </form>
            </div>
            <a class="folder-card uncategorized" th:href="@{/papers(uncategorized=true)}">
                <span class="folder-mark">▱</span>
                <span class="folder-card-name">미분류</span>
                <span class="folder-count" th:text="${uncategorizedCount} + '편'">0편</span>
            </a>
        </div>
    </section>

    <a class="back" th:if="${!browseMode}" th:href="@{/papers}">← 폴더 목록</a>

    <form class="search-bar" th:action="@{/papers}" method="get" th:if="${!browseMode}">
        <input type="text" name="q" th:value="${q}"
               placeholder="제목 · 저자 · 메모 검색" autocomplete="off">
        <input type="hidden" name="tag" th:value="${tag}">
        <input type="hidden" name="uncategorized" th:value="${uncategorized}">
        <select name="folder" aria-label="폴더 선택" th:if="${!uncategorized}">
            <option value="">전체 폴더</option>
            <option th:each="f : ${folders}" th:value="${f.id}" th:text="${f.name}"
                    th:selected="${folder != null and folder == f.id}">폴더</option>
        </select>
        <button type="submit" class="btn">검색</button>
        <a class="btn ghost" th:href="@{/papers}"
           th:if="${q != null or tag != null or folder != null or uncategorized}">초기화</a>
    </form>

    <div class="tag-filter" th:if="${!browseMode and !#lists.isEmpty(tags)}">
        <a th:each="t : ${tags}"
           th:href="@{/papers(tag=${t.name}, q=${q}, folder=${folder}, uncategorized=${uncategorized})}"
           th:text="${t.name}"
           th:class="${tag != null and tag == t.name} ? 'active' : ''">태그</a>
    </div>

    <p class="result-count" th:if="${!browseMode}">
        총 <strong th:text="${papers.totalElements}">0</strong>편
        <span th:if="${q != null}" th:text="'· 검색어: ' + ${q}"></span>
    </p>

    <form th:if="${!browseMode}" th:action="@{/papers/bulk-download}" method="post" id="bulkForm">
        <div class="bulk-bar">
            <span class="selection-count">선택 <strong id="cnt">0</strong>편</span>
            <select id="bulkAction" aria-label="선택 작업">
                <option value="">선택 작업</option>
                <option value="download">다운로드</option>
                <option value="move">폴더 이동</option>
                <option value="delete">삭제</option>
            </select>
            <select id="targetFolder" name="folderId" aria-label="이동할 폴더" hidden>
                <option value="">미분류</option>
                <option th:each="f : ${folders}" th:value="${f.id}" th:text="${f.name}">폴더</option>
            </select>
            <button type="submit" class="btn bulk-action" disabled>실행</button>
            <span class="hint" id="bulkHint">작업을 선택하세요</span>
        </div>

        <table>
            <thead>
            <tr>
                <th class="chk"><input type="checkbox" id="checkAll"></th>
                <th>제목</th>
                <th>폴더</th>
                <th>저자</th>
                <th>등록자</th>
                <th>등록일</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${papers.content}">
                <td class="chk">
                    <input type="checkbox" name="ids" th:value="${p.id}" class="row-chk">
                </td>
                <td>
                    <a th:href="@{/papers/{id}(id=${p.id})}" th:text="${p.title}" class="title-link"></a>
                </td>
                <td th:text="${p.folderName}">미분류</td>
                <td th:text="${p.authors} ?: '-'"></td>
                <td th:text="${p.uploaderName}"></td>
                <td th:text="${#temporals.format(p.createdAt, 'yyyy-MM-dd')}"></td>
            </tr>
            <tr th:if="${papers.isEmpty()}">
                <td colspan="6" class="empty">결과가 없습니다.</td>
            </tr>
            </tbody>
        </table>
    </form>

    <nav class="pagination" th:if="${!browseMode and papers.totalPages > 1}">
        <a th:if="${!papers.first}"
           th:href="@{/papers(page=${papers.number - 1}, q=${q}, tag=${tag}, folder=${folder}, uncategorized=${uncategorized})}">← 이전</a>
        <span th:text="${papers.number + 1} + ' / ' + ${papers.totalPages}"></span>
        <a th:if="${!papers.last}"
           th:href="@{/papers(page=${papers.number + 1}, q=${q}, tag=${tag}, folder=${folder}, uncategorized=${uncategorized})}">다음 →</a>
    </nav>

    <script>
        const rows = document.querySelectorAll('.row-chk');
        const all  = document.getElementById('checkAll');
        const runButton = document.querySelector('.bulk-action');
        const cnt  = document.getElementById('cnt');
        const actionSelect = document.getElementById('bulkAction');
        const targetFolder = document.getElementById('targetFolder');
        const bulkHint = document.getElementById('bulkHint');

        function refresh() {
            const n = document.querySelectorAll('.row-chk:checked').length;
            if (cnt) cnt.textContent = n;
            if (runButton) runButton.disabled = (n === 0 || !actionSelect || !actionSelect.value);
            if (all) all.checked = (n > 0 && n === rows.length);
        }

        if (all) {
            all.addEventListener('change', function () {
                rows.forEach(function (c) { c.checked = all.checked; });
                refresh();
            });
        }
        rows.forEach(function (c) { c.addEventListener('change', refresh); });

        const actions = {
            download: { url: '/papers/bulk-download', hint: '최대 50편 · 다운로드 기록이 남습니다' },
            move: { url: '/papers/bulk-move', hint: '선택한 논문을 지정 폴더로 이동합니다' },
            delete: { url: '/papers/bulk-delete', hint: '선택한 논문을 휴지통으로 이동합니다' }
        };

        if (actionSelect) actionSelect.addEventListener('change', function () {
            const selected = actions[actionSelect.value];
            bulkForm.action = selected ? selected.url : '/papers/bulk-download';
            targetFolder.hidden = actionSelect.value !== 'move';
            bulkHint.textContent = selected ? selected.hint : '작업을 선택하세요';
            refresh();
        });

        const bulkForm = document.getElementById('bulkForm');
        if (bulkForm) bulkForm.addEventListener('submit', function (e) {
            const n = document.querySelectorAll('.row-chk:checked').length;
            if (n === 0) { e.preventDefault(); return; }
            const action = actionSelect.value;
            if (!action) { e.preventDefault(); return; }
            if (action === 'download' && n > 50) {
                e.preventDefault(); alert('한 번에 최대 50편까지 받을 수 있습니다.'); return;
            }
            const message = action === 'delete'
                ? n + '편을 휴지통으로 이동합니다. 계속할까요?'
                : action === 'move'
                    ? n + '편을 선택한 폴더로 이동합니다. 계속할까요?'
                    : n + '편을 다운로드합니다. 다운로드 기록이 남습니다.';
            if (!confirm(message)) { e.preventDefault(); }
        });

        refresh();
    </script>

</main>
</body>
</html>
